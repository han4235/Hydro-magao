{% extends "layout/basic.html" %}
{% block content %}
<div class="row"><div class="medium-9 columns">
  <div class="section">
    <div class="section__header"><h1 class="section__title">AI 导题</h1></div>
    <div class="section__body">
      {% if error %}<p>连不上 ai-server：{{ error }}</p>{% endif %}
      <form method="post" enctype="multipart/form-data">
        <label>处理方式
          <select name="skill">
            {% for item in skills %}
            <option value="{{ item[0] }}">{{ item[1] }}</option>
            {% endfor %}
          </select>
        </label>
        <label>文件<input type="file" name="file" required></label>
        <button type="submit">提交</button>
      </form>
      <h2>最近任务</h2>
      {% if not jobs.length %}<p>还没有任务。</p>{% endif %}
      <ul>
        {% for job in jobs %}
        <li><a href="{{ url('dtoj_ai_job', id=job.id) }}">{{ job.id }}</a> {{ job.skill }} {{ job.status }}</li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div></div>
{% endblock %}
