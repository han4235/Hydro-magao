<nav class="dtoj-home-edit-nav" aria-label="首页配置菜单">
  <a class="dtoj-home-edit-nav__hub{% if not currentSection %} is-on{% endif %}" href="{{ url('dtoj_home_edit_hub') }}">总览</a>
  {% for item in homeEditMenu %}
  <a class="{% if currentSection == item.section %}is-on{% endif %}" href="{{ url('dtoj_home_edit', section=item.section) }}">{{ homeSectionTitles[item.section] }}</a>
  {% endfor %}
  <a class="dtoj-home-edit-nav__back" href="{{ url('homepage') }}">返回首页</a>
</nav>
